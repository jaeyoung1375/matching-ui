name: Front Deploy

# develop 브랜치 푸시 시 자동 배포, 버튼으로 수동 배포도 가능
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-front
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ 깃 repo 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      # 3️⃣ 패키지 설치 (lockfile 기준)
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # 4️⃣ Next.js 빌드
      - name: Build Next.js
        run: npm run build
        env:
          # 서버 환경 변수 예시
          NEXT_PUBLIC_API_URL: http://146.56.116.158:9090
          NODE_ENV: production

      # 5️⃣ pm2로 서버 재시작
      - name: Restart server with pm2
        run: |
          pm2 reload next-app || pm2 start npm --name next-app -- start

      # 6️⃣ 빌드 확인 (선택)
      - name: List build files
        run: ls -l .next
